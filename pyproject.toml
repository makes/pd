[project]
name = "pd"
version = "0.1.0"
description = "A simple video snippet library manager."
readme = "README.md"
authors = [
    { name = "makes" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pywin32>=312 ; sys_platform == 'win32'",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
pd = "pd:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
